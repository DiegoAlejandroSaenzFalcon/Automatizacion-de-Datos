[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "data-tools-workshop"
version = "0.1.0"
description = "Andamiaje documental para futuras herramientas de automatización de datos."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Diego Alejandro Sáenz Falcón", email = "diegoalejandrosaenzfalcon@gmail.com"}
]
requires-python = ">=3.10"

[project.optional-dependencies]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
]

[tool.commitizen]
version = "0.1.0"
version_files = ["pyproject.toml"]
tag_format = "v$version"
commit_message = "chore(release): v{version}"
changelog_file = "CHANGELOG.md"
changelog_format = "markdown"
