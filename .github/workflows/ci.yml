# CI Pipeline - Lint + Type-check + Tests + Validación AI_GUIDELINES
# Se ejecuta en: push/PR a main, tags

name: CI - Validación Obligatoria

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar-ai-guidelines:
    name: Validar AI_GUIDELINES Obligatorio
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            tools/*/pyproject.toml

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,data-processor,pdf-to-excel,file-converter,shared]

      - name: Verificar firma AI_GUIDELINES
        run: |
          if [[ ! -f .ai_guidelines_firmado ]]; then
            echo "❌ AI_GUIDELINES no firmado. Ejecuta ./scripts/firmar_ai_guidelines.sh"
            exit 1
          fi
          echo "✅ AI_GUIDELINES firmado"

      - name: Verificar idioma español en documentación
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import re, pathlib
          skip = {'AI_GUIDELINES.md','AGENTS.md','HONEYTOKEN.md','CLA.md'}
          eng = ['Roadmap','Getting Started','Architecture','Reference','Business','Pricing','Overview','Summary','Introduction','Conclusion','Background','Methodology','Results','Discussion','Features','Requirements','Installation','Usage','Configuration','Deployment','Testing','Contributing','License','Authors','Acknowledgments','Changelog','Migration','Upgrade','Downgrade','Release','Version','Build','Deploy','Test','Lint','Format','Type Check','Security','Performance','Benchmark','Profiling','Optimization','Refactoring','Feature','Bug Fix','Hotfix','Breaking Change','Deprecated','Removed','Added','Changed','Fixed','Improvement','Enhancement']
          bad = False
          for f in pathlib.Path('.').rglob('*.md'):
              if f.name in skip:
                  continue
              for i, l in enumerate(f.read_text(encoding='utf-8').split('\n')[:20], 1):
                  if re.match(r'^#{1,3}\s+[A-Z][a-z]+(\s+[A-Z][a-z]+)+', l):
                      print(f'{f}:{i}: titulo en ingles: {l.strip()}'); bad = True
                  if l.startswith('#') and any(p in l for p in eng):
                      print(f'ERROR: {f}: palabra inglesa en titulo: {l.strip()}'); bad = True
          if bad:
              exit(1)
          print('OK Documentacion en espanol correcta')
          PYEOF

  lint-and-type-check:
    name: Lint + Type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validar-ai-guidelines
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            tools/*/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,data-processor,pdf-to-excel,file-converter,shared]

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check .

      - name: MyPy type-check
        run: mypy --strict .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validar-ai-guidelines
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            tools/*/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,data-processor,pdf-to-excel,file-converter,shared]

      - name: Run tests
        run: |
          pytest --cov=tools --cov-report=xml --cov-report=term-missing \
            --junitxml=test-results-${{ matrix.python-version }}.xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: unittests
          name: coverage-py${{ matrix.python-version }}
          fail_ci_if_error: false

  check-results:
    name: All checks passed
    needs: [validar-ai-guidelines, lint-and-type-check, test]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        run: echo "✅ All CI checks passed"