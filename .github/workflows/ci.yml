# Validación documental del repositorio

name: CI - Validación documental

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    name: Construcción de documentación
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar documentación
        run: python -m pip install --upgrade pip mkdocs mkdocs-material

      - name: Construir documentación estrictamente
        run: mkdocs build --strict

      - name: Comprobar referencias obsoletas
        run: |
          ! grep -R -n -E 'Directivas-de-Seguridad-IA|C:\\Proyectos' --exclude-dir=.git .
